id: vcf-liftover
name: VCF Liftover
description: >
  Nextflow pipeline for converting genomic coordinates between genome builds
  (e.g., GRCh37/hg19 to GRCh38/hg38) with comprehensive validation and QC reporting.
version: 2.0.0
website: https://github.com/AfriGen-D/vcf-liftover
category: Application
submitButton: Start Liftover

workflow:
  steps:
    - name: VCF Liftover
      type: nextflow
      script: main.nf

  # Pipeline stages shown in the job progress timeline
  stages:
    - id: input_handler
      label: Input Processing
      processes: [INPUT_HANDLER]
      expected_tasks: 1
    - id: input_check
      label: Input Validation
      processes: [INPUT_CHECK]
      expected_tasks: 1
    - id: build_check
      label: Build Check
      processes: [CHECK_BUILD_MISMATCH, VALIDATE_CHROMOSOMES]
      expected_tasks: 1
    - id: liftover
      label: Liftover
      processes: [CROSSMAP_VCF, PICARD_LIFTOVER]
      expected_tasks: 1
    - id: postprocessing
      label: Post-processing
      processes: [SORT_VCF, RENAME_CHROMOSOMES, FIX_CONTIG, GENERATE_CHR_MAPPING, FILTER_REJECTED]
      expected_tasks: 5
    - id: indexing
      label: Indexing & Stats
      processes: [INDEX_VCF, LIFTOVER_STATS, GENERATE_REPORT]
      expected_tasks: 3
    - id: split_by_chr
      label: Split by Chromosome
      processes: [SPLIT_BY_CHR]
      expected_tasks: 1

  inputs:
    - id: source_build
      description: Source Genome Build
      type: list
      value: hg19
      values:
        hg19: hg19/GRCh37/b37
        hg38: hg38/GRCh38/b38

    - id: target_build
      description: Target Genome Build
      type: list
      value: hg38
      values:
        hg38: hg38/GRCh38/b38
        hg19: hg19/GRCh37/b37

    # Chain file and target FASTA are NOT exposed as separate dropdowns
    # because they are derived from (source_build, target_build) at config
    # load time in nextflow.config. Exposing them led to user error: a
    # 2026-05-12 production submission asked for hg19 -> hg38 but left the
    # default chain (hg38ToHg19), and the pipeline silently produced 22 MB
    # of corrupt output (270k MismatchedRefAllele rejections). Auto-deriving
    # makes that misconfiguration unrepresentable from the UI.

    - id: split_by_chr
      description: Split output by chromosome
      details: >
        Produces one VCF per chromosome (chr1.vcf.gz, chr2.vcf.gz, ...) in
        a per_chromosome/ directory alongside the merged output. Required
        if you plan to submit the lifted file to Genotype Imputation, which
        rejects multi-chromosome VCFs.
      type: checkbox
      value: false

    - id: validate_output
      description: Validate Output
      type: checkbox
      value: false

    - id: liftover_tool
      description: Liftover Tool
      type: list
      value: picard
      values:
        picard: "Picard LiftoverVcf (recommended)"
        crossmap: "CrossMap (legacy)"

  # Default Nextflow params merged with user selections. chain_file and
  # target_fasta are intentionally omitted: nextflow.config derives them
  # from source_build / target_build, so any value listed here would just
  # be overridden anyway.
  defaults:
    source_build: hg19
    target_build: hg38
    split_by_chr: false
    validate_output: false
    liftover_tool: picard

  # Nextflow `-profile` to pass at submission time. The AfriGen-D WES
  # runner is a k3s pod with no local Docker daemon -- jobs that
  # default to `profile: docker` (the FedImpute service-level
  # fallback) fail with "Cannot connect to the Docker daemon at
  # unix:///var/run/docker.sock". `k8s` delegates each process to a
  # per-task K8s pod, which is the supported path.
  engine_parameters:
    profile: k8s

  # Input VCF param name for this pipeline
  input_param: input

  # Output param name
  output_param: outdir
