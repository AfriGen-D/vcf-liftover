name: CI Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity

jobs:
  test:
    name: Pipeline Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: ['test,docker']
        nextflow_version: ['23.04.0', '24.04.0', 'latest']

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: ${{ matrix.nextflow_version }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Run pipeline with test data
        run: |
          nextflow run ${GITHUB_WORKSPACE}/main.nf \
            -profile ${{ matrix.profile }} \
            --outdir results \
            -resume

      - name: Validate outputs
        run: |
          # Check if required output files exist
          test -d results/final || (echo "Final output directory not found" && exit 1)
          test -d results/reports || (echo "Reports directory not found" && exit 1)

          # Check for report files
          test -f results/reports/liftover_statistics.txt || (echo "Statistics file not found" && exit 1)
          test -f results/reports/liftover_summary_report.html || (echo "HTML report not found" && exit 1)
          test -f results/reports/sample_summary.csv || (echo "CSV report not found" && exit 1)

          # Per-chromosome split is enabled in conf/test.config, so the
          # per_chromosome/ directory must exist with at least one chr*.vcf.gz
          # plus a .tbi index. Guards against regressions in SPLIT_BY_CHR.
          test -d results/per_chromosome || (echo "per_chromosome dir not found" && exit 1)
          ls results/per_chromosome/*.chr*.vcf.gz >/dev/null 2>&1 || (echo "No per-chromosome VCFs produced" && exit 1)
          ls results/per_chromosome/*.chr*.vcf.gz.tbi >/dev/null 2>&1 || (echo "Per-chromosome VCFs missing tabix indices" && exit 1)

          echo "All expected outputs found!"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.nextflow_version }}
          path: |
            results/
            .nextflow.log
          retention-days: 7

  python-tests:
    name: Python Scripts Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Test Python scripts syntax
        run: |
          python -m py_compile bin/*.py
          echo "✅ All Python scripts compile successfully!"

      - name: Validate script executables
        run: |
          # Check that scripts are executable
          test -x bin/validate_vcf.py || (echo "validate_vcf.py not executable" && exit 1)
          test -x bin/check_input.py || (echo "check_input.py not executable" && exit 1)
          test -x bin/generate_liftover_stats.py || (echo "generate_liftover_stats.py not executable" && exit 1)
          test -x bin/process_input.py || (echo "process_input.py not executable" && exit 1)
          echo "✅ All scripts are executable!"

      - name: Test script help messages
        run: |
          python bin/validate_vcf.py --help || true
          python bin/check_input.py --help || true
          python bin/generate_liftover_stats.py --help || true
          echo "✅ Scripts have valid help messages!"

  nextflow-lint:
    name: Nextflow Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1

      - name: Run Nextflow syntax check
        run: |
          nextflow run ${GITHUB_WORKSPACE}/main.nf --help

      - name: Validate Nextflow config
        run: |
          nextflow config ${GITHUB_WORKSPACE}/main.nf -profile test,docker

  integration-test:
    name: Integration Test (Small Dataset)
    runs-on: ubuntu-latest
    needs: [test, python-tests, nextflow-lint]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run integration test with small dataset
        run: |
          # Test with CSV input
          nextflow run ${GITHUB_WORKSPACE}/main.nf \
            -profile test,docker \
            --outdir integration_results \
            -resume

      - name: Validate success rate
        run: |
          # The test profile should complete successfully
          # Note: May have 0% success due to stub reference, but should complete without errors
          test -f integration_results/reports/liftover_statistics.txt || exit 1
          echo "✅ Integration test completed successfully!"

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            integration_results/
            .nextflow.log
          retention-days: 3
