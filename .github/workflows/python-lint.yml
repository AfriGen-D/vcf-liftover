name: Python Code Quality

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'bin/*.py'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'bin/*.py'

jobs:
  lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort

      - name: Check code formatting with Black
        run: |
          black --check --diff bin/*.py || echo "⚠️  Code formatting issues found (run: black bin/*.py)"

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff bin/*.py || echo "⚠️  Import sorting issues found (run: isort bin/*.py)"

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 bin/*.py --count --select=E9,F63,F7,F82 --show-source --statistics

          # Exit-zero treats all errors as warnings
          flake8 bin/*.py --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Lint with pylint
        continue-on-error: true
        run: |
          pylint bin/*.py --exit-zero --max-line-length=100

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r bin/ -f json -o bandit-report.json || true
          bandit -r bin/ || echo "⚠️  Security issues found"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Run mypy type checker
        continue-on-error: true
        run: |
          mypy bin/*.py --ignore-missing-imports || echo "⚠️  Type checking issues found"

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install pydocstyle
        run: |
          python -m pip install --upgrade pip
          pip install pydocstyle

      - name: Check docstrings
        continue-on-error: true
        run: |
          pydocstyle bin/*.py || echo "⚠️  Documentation issues found"

      - name: Verify all scripts have help text
        run: |
          echo "Checking help text for all Python scripts..."
          for script in bin/*.py; do
            if [ -x "$script" ]; then
              echo "Testing: $script"
              python "$script" --help > /dev/null 2>&1 || echo "⚠️  $script missing help text"
            fi
          done
          echo "✅ Help text check complete!"
